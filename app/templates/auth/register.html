{% extends "auth/guest_layout.html" %}

{% block title %}
Register
{% endblock %}

{% block content %}

<section class="auth-section d-flex align-items-center">

    <div class="container">

        <div class="row justify-content-center">

            <div class="col-lg-5 col-md-7">

                <div class="card auth-card border-0 shadow-lg">

                    <div class="card-body p-5">

                        <div class="text-center mb-4">
                            <h2 class="fw-bold mb-2"> Create Account</h2>
                            <p class="text-light mb-0">Join TrekConnect and start your next adventure.</p>
                        </div>

                        <form method="POST">
                            <div class="mb-3">
                                <label class="form-label text-white">Full Name </label>
                                <input type="text" name="name" class="form-control" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label text-white">Email Address</label>
                                <input type="email" name="email" class="form-control" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label text-white">Mobile Number</label>
                                <input type="tel" name="mobile_number" class="form-control" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label text-white"> Set a new Password </label>
                                <input type="password" name="password" class="form-control" required>
                            </div>

                            <button type="submit" class="btn btn-success w-100 py-2 fw-semibold">
                                Create Account
                            </button>
                        </form>

                        <hr class="my-4">

                        <div class="text-center">
                            <p class="mb-0"> Already have an account? <a href="{{ url_for('auth.login') }}" class="link-info"> Login </a></p>
                        </div>

                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

{% endblock %}
