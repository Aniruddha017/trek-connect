{% extends "base.html" %}

{% block title %}
Admin Dashboard
{% endblock %}

{% block content %}

<h1 class="mb-4">Admin Dashboard</h1>

<div class="row">

    <div class="col-md-3 mb-3">
        <div class="card text-center">
            <div class="card-body">
                <h5>Total Users</h5>
                <h2>{{ total_users }}</h2>
            </div>
        </div>
    </div>

    <div class="col-md-3 mb-3">
        <div class="card text-center">
            <div class="card-body">
                <h5>Staff Members</h5>
                <h2>{{ total_staff }}</h2>
            </div>
        </div>
    </div>

    <div class="col-md-3 mb-3">
        <div class="card text-center">
            <div class="card-body">
                <h5>Total Treks</h5>
                <h2>{{ total_treks }}</h2>
            </div>
        </div>
    </div>

    <div class="col-md-3 mb-3">
        <div class="card text-center">
            <div class="card-body">
                <h5>Bookings</h5>
                <h2>{{ total_bookings }}</h2>
            </div>
        </div>
    </div>

</div>

{% endblock %}
