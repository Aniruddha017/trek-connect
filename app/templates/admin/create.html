{% extends "base.html" %}

{% block title %}
Create Trek
{% endblock %}

{% block content %}

<h1>Create Trek</h1>
<form method="POST" enctype="multipart/form-data">
    <div class="mb-3">
        <label>Name</label>
        <input class="form-control"
               name="name"
               required>
    </div>

    <div class="mb-3">
        <label>Location</label>
        <input class="form-control"
               name="location"
               required>
    </div>

    <div class="mb-3">
        <label>Difficulty</label>

        <select class="form-select"
                name="difficulty">

            <option>Easy</option>
            <option>Moderate</option>
            <option>Hard</option>

        </select>
    </div>

    <div class="mb-3">
        <label>Duration (Days)</label>
        <input type="number"
               class="form-control"
               name="duration_days"
               required>
    </div>

    <div class="mb-3">
        <label>Total Slots</label>
        <input type="number"
               class="form-control"
               name="total_slots"
               required>
    </div>

    <div class="mb-3">
        <label>Start Date</label>
        <input type="date"
               class="form-control"
               name="start_date"
               required>
    </div>

    <div class="mb-3">
        <label>Description</label>

        <textarea class="form-control"
                  rows="5"
                  name="description">
        </textarea>
    </div>
    <div class="mb-3">
        <label class="form-label">Trek Image</label>

        <input
            type="file"
            name="image"
            class="form-control"
            accept="image/*"
        >
    </div>
    
    <button class="btn btn-success">
        Create Trek
    </button>

</form>

{% endblock %}
