<!DOCTYPE html>
<html>
<head>
    <title>Staff Dashboard</title>
</head>
<body>

    <h1>Staff Dashboard</h1>

    <h3>Assigned Treks</h3>

    {% if treks %}

        <ul>
        {% for trek in treks %}

            <li>
                <strong>{{ trek.name }}</strong>
                |
                Status: {{ trek.status }}
                |
                Participants: {{ trek.bookings|length }}

                <a href="{{ url_for('staff.trek_details',trek_id=trek.id) }}">
                    Manage
                </a>

            </li>

        {% endfor %}
        </ul>

    {% else %}

        <p>No treks assigned.</p>

    {% endif %}

</body>
</html>
